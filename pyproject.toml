[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "menpo3d"
dynamic = ["version"]
description = "Menpo library providing tools for 3D Computer Vision research"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE.txt", "AUTHORS.txt"]
authors = [{ name = "The Menpo Team", email = "hello@menpo.org" }]
requires-python = ">=3.10"
dependencies = ["menpo>=0.12.1", "moderngl>=5.6", "numpy>=1.23", "scipy>=1.0"]

[project.optional-dependencies]
# menpo3d.visualize, interactive: moderngl frames streamed to a notebook widget or a browser window
viz_notebook = ["scene-streamer[notebook,fast-jpeg]>=0.1"]
# H.264 video for the streamed viewer (smaller and smoother than the JPEG frames it falls back to); PyAV bundles ffmpeg
viz_h264 = ["scene-streamer[h264]>=0.1"]
# menpo3d.visualize, interactive: the native viewer window (moderngl-window on GLFW)
viz_native_window = ["moderngl-window>=3.1", "glfw>=2.6"]
# everything the interactive viewers can use
viz = ["menpo3d[viz_notebook,viz_h264,viz_native_window]"]
# the previous Mayavi based viewers, selected with MENPO3D_VIEWER=mayavi (Mayavi brings VTK and Qt along)
mayavi = ["mayavi>=4.8"]
# menpo3d.correspond.pnp (solve_pnp)
opencv = ["opencv-python"]

[project.urls]
Homepage = "https://www.menpo.org"
Source = "https://github.com/menpo/menpo3d"
Documentation = "https://menpo3d.readthedocs.io/en/stable/"

[dependency-groups]
dev = ["pytest>=8", "pytest-mock>=3", "ruff", "opencv-python-headless", "scene-streamer[notebook,h264,fast-jpeg]>=0.1", "moderngl-window>=3.1", "glfw>=2.6"]

# the Mayavi viewers, which the pixel oracle test compares the moderngl viewers with
mayavi-oracle = ["mayavi>=4.8", "PySide6"]

[tool.setuptools.packages.find]
include = ["menpo3d*"]

[tool.setuptools.package-data]
menpo3d = ["data/*", "io/*.json", "rasterize/shaders/per_vertex/*", "rasterize/shaders/texture/*"]

[tool.setuptools_scm]
# Version comes from the vX.Y.Z git tag; the generated file replaces the old vendored miniver.
version_file = "menpo3d/_version.py"
local_scheme = "no-local-version"

[tool.pytest.ini_options]
testpaths = ["menpo3d"]

[tool.ruff]
line-length = 88
extend-exclude = ["docs", "menpo3d/_version.py"]

[tool.ruff.lint]
select = ["E9", "F"]
ignore = ["F401", "F403", "F405", "F841"]
