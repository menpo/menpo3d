name: CI
on:
  push: { branches: [master] }
  pull_request:

env:
  # there is no display: Mayavi must not try to open a window
  ETS_TOOLKIT: "null"
  QT_QPA_PLATFORM: offscreen
  MPLBACKEND: Agg

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uvx ruff check .
      - run: uvx ruff format --check .

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # setuptools-scm needs tags
      - uses: astral-sh/setup-uv@v5
      - name: Software OpenGL and a virtual display (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libglx-mesa0 libgl1-mesa-dri libegl1 libxrender1
      - run: uv sync --python ${{ matrix.python }} --group dev
      # The OpenGL rasterizer tests skip when there is no OpenGL 3.3 context (Windows runners)
      - name: Tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a uv run pytest -q -rs
      - name: Tests
        if: runner.os != 'Linux'
        run: uv run pytest -q -rs

  # The importers no longer use VTK, but their topology must stay what VTK produced. This job
  # installs VTK and Mayavi (everything else runs without them) and re-derives the fingerprints.
  vtk-oracle:
    needs: lint
    runs-on: ubuntu-latest
    continue-on-error: true   # a new VTK release changing its readers should be looked at, not block merges
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@v5
      - run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libglx-mesa0 libgl1-mesa-dri libegl1 libxrender1
      - run: uv sync --group dev --group vtk-oracle
      - run: xvfb-run -a uv run pytest -q -rs
      - run: uv run python -m menpo3d.io.importer_variants_test --check

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@v5
      - run: uv build --sdist
      - name: Build and test from the sdist (conda-forge builds from it; no git)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libglx-mesa0 libgl1-mesa-dri libegl1 libxrender1
          uv venv .venv-sdist
          uv pip install --python .venv-sdist dist/*.tar.gz pytest pytest-mock opencv-python-headless
          cd "$(mktemp -d)"
          xvfb-run -a "$GITHUB_WORKSPACE/.venv-sdist/bin/python" -m pytest --pyargs menpo3d -q -rs

  docs:
    runs-on: ubuntu-latest
    env:
      READTHEDOCS: "True"   # as on Read the Docs: use the installed menpo3d
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@v5
      - name: Only one Read the Docs config (it prefers a legacy readthedocs.yml over .readthedocs.yaml)
        run: |
          if ls readthedocs.yml readthedocs.yaml .readthedocs.yml 2>/dev/null; then
            echo "legacy Read the Docs config file(s) above must be removed"; exit 1
          fi
      - name: Validate the Read the Docs configuration against its schema
        run: uvx check-jsonschema --builtin-schema vendor.readthedocs .readthedocs.yaml
      - name: System libraries that Read the Docs installs (.readthedocs.yaml apt_packages)
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglx-mesa0 libegl1 libxrender1
      - name: Install what Read the Docs installs
        run: |
          uv venv --python 3.13 .venv-docs
          uv pip install --python .venv-docs -r docs/requirements.txt .
      - name: Build the docs
        run: .venv-docs/bin/python -m sphinx -b html -j auto docs/source docs/_build 2>&1 | tee docs-build.log
      - name: Autodoc must be able to import everything, and the cross-references must resolve
        run: |
          if grep -E "autodoc: failed to import|sphinxmapxrefrole\] - Failed" docs-build.log; then exit 1; fi
