# Read the Docs configuration (https://docs.readthedocs.com/platform/stable/config-file/v2.html)
version: 2

build:
  os: ubuntu-lts-latest
  tools:
    python: "3.13"
  apt_packages:
    # OpenGL libraries, which autodoc loads when it imports menpo3d (moderngl)
    - libgl1
    - libglx-mesa0
    - libegl1
    - libxrender1
  jobs:
    post_checkout:
      # the version comes from git tags (setuptools-scm) but Read the Docs clones shallowly
      - git fetch --unshallow || true
      - git fetch --tags || true
    post_install:
      # Not `method: pip`: the package requires menpo>=0.13, which the pre-release 0.13.0rc1 in
      # docs/requirements.txt does not satisfy, so its dependencies are listed there instead.
      # Back to `method: pip` when menpo 0.13 is released.
      - python -m pip install --no-deps .

sphinx:
  configuration: docs/source/conf.py

python:
  install:
    - requirements: docs/requirements.txt
